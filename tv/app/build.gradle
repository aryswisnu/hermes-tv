plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// One KEY=value per line; # starts a comment. Backslashes stay as they are: a camera password may hold one.
def readProperties = { File file ->
    def values = [:]
    file.eachLine { line ->
        def eq = line.indexOf('=')
        if (!line.trim().startsWith('#') && eq > 0) values[line.substring(0, eq).trim()] = line.substring(eq + 1).trim()
    }
    values
}
def literal = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

// The bridge address and TV_KEY: gitignored, never printed.
def bridgeFile = rootProject.file('bridge.properties')
if (!bridgeFile.exists()) throw new GradleException('tv/bridge.properties is missing: copy tv/bridge.properties.example to tv/bridge.properties and set BRIDGE_URL and TV_KEY')
def bridge = readProperties(bridgeFile)
if (!bridge['BRIDGE_URL']) throw new GradleException('BRIDGE_URL is missing in tv/bridge.properties: set it to the bridge address, as in tv/bridge.properties.example')
['BRIDGE_URL', 'TV_KEY'].each { key ->
    if (bridge[key]?.contains('<')) throw new GradleException("${key} in tv/bridge.properties is still the example placeholder: set your own value")
}
if (!bridge['TV_KEY']) logger.warn('TV_KEY not found in tv/bridge.properties: the bridge will reject every request')

// Camera URLs hold the camera passwords: gitignored, never printed. Without any URL the build has no Cameras tile.
def cameraFile = rootProject.file('camera.properties')
def camera = cameraFile.exists() ? readProperties(cameraFile) : [:]
// A key the file lacks is an empty string: a camera without CAMERA_n_URL is not in the grid.
def cameraLiteral = { key -> literal(camera[key] ?: '') }

android {
    namespace 'hermestv.launcher'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'hermestv.launcher'
        minSdk 31
        targetSdk 34
        versionCode 2
        versionName '2.0'
        buildConfigField 'String', 'BRIDGE_URL', literal(bridge['BRIDGE_URL'])
        buildConfigField 'String', 'TV_KEY', literal(bridge['TV_KEY'] ?: '')
        (1..4).each { n ->
            ['URL', 'SUB_URL', 'NAME', 'FULL'].each { field ->
                def key = "CAMERA_${n}_${field}".toString()
                buildConfigField 'String', key, cameraLiteral(key)
            }
        }
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded only, so the debug key is enough.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    // Log calls on error paths return instead of throwing in unit tests.
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    // 1.4 is the last media3 line that builds with compileSdk 34.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // media3-exoplayer-rtsp 1.4.1 is copied into src/main/java/androidx/media3/exoplayer/rtsp (patched for EZVIZ H.265 SDP).
    implementation 'androidx.annotation:annotation:1.3.0'
    compileOnly 'org.checkerframework:checker-qual:3.33.0'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.18.0'
    testImplementation 'junit:junit:4.13.2'
    // android.jar only has stubs of org.json; unit tests need the real one.
    testImplementation 'org.json:json:20240303'
}
