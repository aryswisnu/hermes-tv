[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tv-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "yt-dlp>=2026.8.19",  # floor only: a weekly timer upgrades it, YouTube changes often
]

[project.optional-dependencies]
test = ["pytest", "respx"]

[tool.setuptools]
packages = ["hermestv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
